<!doctype html><html lang="ko"><meta charset="utf-8"><title>8.6 신규 3진 모션</title><style>body{background:#182337;color:#eef5ff;font:16px system-ui;max-width:1300px;margin:32px auto}button{padding:12px;margin:4px;background:#38516f;color:white;border:0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#2a3c53;border-radius:16px;padding:16px}canvas{width:100%;background:linear-gradient(transparent 89%,#76917a 89%)}small{color:#bdd2e7}</style><h1>8.6 신규 3진 · 30FPS</h1><p>크림슨 · 샤르트뢰즈 · 민트 · 블랙</p><nav><button data-mode="idle">대기</button><button data-mode="walk">걷기</button><button data-mode="attack">공격</button><button data-mode="hurt">넉백</button></nav><div class="grid"></div><script src="../../assets/third-form-86-motion/atlas.js"></script><script>const names={crimson:'브레이커 크림슨',chartreuse:'세븐버스트 샤르트뢰즈',mint:'프로즌 파티시에 민트',black:'고문서 명필 블랙'};let mode='idle',epoch=performance.now();const rows=[];for(const[id,a]of Object.entries(THIRD86_ATLASES)){const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+names[id]+'</h2><canvas width="480" height="320"></canvas><small>대기 60 · 걷기 18 · 공격 '+a.attack.length+' · 넉백 1프레임</small>';document.querySelector('.grid').append(card);const im=new Image();im.src='../../'+a.sheet;rows.push({a,im,c:card.querySelector('canvas').getContext('2d')});}for(const b of document.querySelectorAll('button'))b.onclick=()=>{mode=b.dataset.mode;epoch=performance.now()};function loop(now){const t=(now-epoch)/1000;for(const{a,im,c}of rows){c.clearRect(0,0,480,320);if(!im.complete||!im.naturalWidth)continue;const frames=a[mode],f=frames[Math.floor(t*30)%frames.length],bounce=mode==='hurt'?Math.abs(Math.sin(t%1.2/1.2*Math.PI*2))*20:0;c.save();const dx=280-f[4],dy=285+f[5]-f[3]-bounce;if(f[7]){c.translate(dx+f[2],dy);c.scale(-1,1);c.drawImage(im,f[0],f[1],f[2],f[3],0,0,f[2],f[3]);}else c.drawImage(im,f[0],f[1],f[2],f[3],dx,dy,f[2],f[3]);c.restore();}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></html>
