<script>const data={units:{}},UNIT_NAMES={},ENEMY_ORDER=[],NEW_ATLASES={},ENEMY_TEXT={};function codexTraitBadges(){return []}function freqWord(){return ''}</script><script src="../../enemies-86.js?v=2"></script>
<script>
let mode='idle',paused=false,t=0,last=0,rig;const rows=[],root='../../',grid=document.querySelector('.grid'),status=document.querySelector('#status');
function card(name,note){const c=document.createElement('article');c.className='card';c.innerHTML='<h2>'+name+'</h2><p>'+note+'</p><canvas width="600" height="420"></canvas>';grid.append(c);return c.querySelector('canvas').getContext('2d');}
for(const form of [1,2])rows.push({form,c:card('사프 '+form+'진','여성 · 향신료 상인 · 파츠 모션')});
const names={crimson:'브레이커 크림슨',chartreuse:'세븐버스트 샤르트뢰즈',mint:'프로즌 파티시에 민트',black:'고문서 명필 블랙'};
function add(name,a,note){const im=new Image();im.src=root+a.sheet;rows.push({a,im,c:card(name,note)});}
const explorer=typeof EXPLORER_MINT86_ATLAS!=='undefined'?EXPLORER_MINT86_ATLAS:null;
// The atlas file uses its own exported constant; resolve below without game modules.
if(explorer)add('고대 유적 수호 민트시안',explorer,'탐사 민트시안 3진');
for(const[id,a]of Object.entries(THIRD86_ATLASES))add(names[id],a,'신규 기본 캐릭터 3진');
for(const id of ENEMY_ORDER)add(UNIT_NAMES[id],NEW_ATLASES[id],'신규 적 · 원작 파츠로 조립한 모션');
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;t=0;document.querySelectorAll('[data-mode]').forEach(n=>n.classList.toggle('active',n===b));};
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재생':'일시정지';};document.querySelector('#step').onclick=()=>{paused=true;t+=1/30;document.querySelector('#pause').textContent='재생';render();};
function render(){for(const r of rows){const c=r.c;c.clearRect(0,0,600,420);if(r.form){if(rig)rig.draw(c,{form:r.form,mode,time:t});continue;}if(!r.im.complete||!r.im.naturalWidth)continue;const a=r.a,frames=a[mode]||a.walk,step=mode==='attack'?(a.attackStep||1):mode==='walk'?(a.walkStep||1/30)*30:1,f=frames[Math.floor(t*30/step)%frames.length],all=[...a.walk,...a.attack,...(a.hurt||[])],wide=Math.max(...all.map(f=>Math.max(Math.abs(f[4]||0),Math.abs(f[2]-(f[4]||0))))),tall=Math.max(...all.map(f=>f[3]-(f[5]||0))),k=Math.min(1.2,270/tall,270/wide),[x,y,w,h,ox=0,oy=0,rot=0,flip=0]=f,bounce=mode==='hurt'?Math.abs(Math.sin(t%1.2/1.2*Math.PI*2))*18:0;c.save();c.translate(300-ox*k,370+(oy-h)*k-bounce);if(flip){c.translate(w*k,0);c.scale(-1,1);}c.drawImage(r.im,x,y,w,h,0,0,w*k,h*k);c.restore();}}
function loop(now){if(last&&!paused)t+=Math.min(.1,(now-last)/1000);last=now;render();requestAnimationFrame(loop);}SaffronRig.load(root+'assets/saffron-parts/').then(r=>{rig=r;status.textContent='그림을 누락 없이 불러오면 대기·걷기·공격·넉백을 바꿔 확인하세요.';}).catch(e=>{status.textContent='사프 파츠 로딩 실패: '+e.message;status.className='error';});requestAnimationFrame(loop);
</script></html>
