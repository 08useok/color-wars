<!doctype html><html lang="ko"><meta charset="utf-8"><title>플래티넘 모션 미리보기</title>
<style>body{margin:30px;background:#eef2f7;color:#222;font:17px system-ui;text-align:center}main{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}section{background:white;padding:20px;border-radius:16px}canvas{background:#dbe3ec;width:256px;height:256px}button{padding:9px 18px;margin:8px;border:1px solid #aaa;border-radius:9px;background:white;cursor:pointer}button[aria-pressed=true]{background:#354b63;color:white}small{display:block;margin:16px}</style>
<h1>플래티넘 1·2진</h1><nav><button data-mode="walk">걷기</button><button data-mode="attack">공격</button><button data-mode="hurt">피격·복귀</button></nav>
<main><section><h2>1진</h2><canvas id="form1" width="256" height="256"></canvas></section><section><h2>2진</h2><canvas id="form2" width="256" height="256"></canvas></section></main><small>외형·모션 검토용. 게임 능력치·보상·캐릭터 연결은 아직 없음.</small>
<script src="../../assets/platinum-motion/platinum-motion-atlases.js"></script><script>
let mode='walk',start=performance.now();window.previewFrames=0;const pictures=[1,2].map(form=>{const img=new Image;img.src='../../assets/platinum-motion/platinum_'+form+'.webp';return img});
for(const button of document.querySelectorAll('button')){button.setAttribute('aria-pressed',button.dataset.mode===mode);button.onclick=()=>{mode=button.dataset.mode;start=performance.now();for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',b===button)}}
function tick(now){for(const form of [1,2]){const a=PLATINUM_MOTION_ATLASES['platinum_'+form],frames=mode==='hurt'?[...a.hurt,a.hurtRecovery]:a[mode],frame=frames[Math.floor((now-start)/(mode==='hurt'?220:mode==='walk'?130:120))%frames.length],ctx=document.getElementById('form'+form).getContext('2d');ctx.clearRect(0,0,256,256);if(pictures[form-1].complete&&pictures[form-1].naturalWidth)ctx.drawImage(pictures[form-1],...frame.slice(0,4),0,0,256,256)}window.previewFrames++;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
