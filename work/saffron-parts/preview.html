<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사프 파츠 모션</title><style>body{margin:24px auto;padding:0 18px;max-width:1200px;background:#1a2639;color:#eef3fc;font:16px system-ui}button,select{font:inherit;background:#344b68;color:white;border:1px solid #7087a5;border-radius:8px;padding:9px;margin:4px}button[aria-pressed=true]{background:#a16d13}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#293b53;border-radius:14px;padding:12px}canvas{width:100%;background:linear-gradient(transparent 86%,#4c635e 86%)}small{color:#c0cfdf}@media(max-width:720px){.cards{grid-template-columns:1fr}}</style><h1>사프 · 1·2진 파츠 모션</h1><p>여성 · 향신료 상인 · 30FPS</p><nav id="controls"><button data-mode="idle" aria-pressed="true">대기</button><button data-mode="walk">걷기</button><button data-mode="attack">공격</button><button data-mode="hurt">넉백</button><button id="pause">일시정지</button><button id="step">1프레임</button><button id="replay">처음부터</button><label><input id="debug" type="checkbox"> 연결점 보기</label><label>속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select></label></nav><p id="status" role="status">파츠 불러오는 중…</p><div class="cards"><section class="card"><h2>1진 · 사프</h2><canvas id="form1" width="600" height="420"></canvas></section><section class="card"><h2>2진 · 사프 외형</h2><canvas id="form2" width="600" height="420"></canvas></section></div><p><small>스푼·그릇은 손 위치를 따라 움직입니다. 2진은 완전한 팔 파츠를 어깨에 고정하며, 표정은 눈·입 파츠를 교체합니다. 게임 전투·뽑기와 같은 파츠를 사용합니다.</small></p><script src="../../assets/saffron-parts/parts.js"></script><script src="../../assets/saffron-parts/saffron-rig.js?v=7"></script><script>
let rig,mode='idle',playing=true,time=0,last=0,frame=-1;globalThis.__saffronReady=false;globalThis.__saffronErrors=[];addEventListener('error',e=>__saffronErrors.push(e.message));const canvases=[document.querySelector('#form1'),document.querySelector('#form2')];
function render(){if(!rig)return;const reports=canvases.map((c,i)=>{const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);return rig.draw(ctx,{form:i+1,mode,time,x:300,y:365,debug:document.querySelector('#debug').checked});});globalThis.__saffronReports=reports;document.querySelector('#status').textContent=mode+' · '+Math.floor(time*30)+'프레임 · '+(playing?'재생 중':'정지');}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;time=0;frame=-1;for(const q of document.querySelectorAll('[data-mode]'))q.setAttribute('aria-pressed',String(q===b));render();};document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'일시정지':'재생';render();};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#pause').textContent='재생';time+=1/30;render();};document.querySelector('#replay').onclick=()=>{time=0;frame=-1;render();};document.querySelector('#debug').onchange=render;
function loop(now){if(!last)last=now;if(playing)time+=Math.min(.1,(now-last)/1000)*Number(document.querySelector('#speed').value);last=now;const f=Math.floor(time*30);if(f!==frame){frame=f;render();}requestAnimationFrame(loop);}SaffronRig.load('../../assets/saffron-parts/').then(r=>{rig=r;globalThis.__saffronReady=true;render();requestAnimationFrame(loop);}).catch(e=>{__saffronErrors.push(e.message);document.querySelector('#status').textContent='불러오기 실패: '+e.message;});
</script></html>
